<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>emblem-ooda</title>
<style>html,body{margin:0;height:100%;background:transparent}body{display:flex;align-items:center;justify-content:center}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script type="module">
const SRC = ['source.svg'];
const W = 240, H = 240, PAD = 0;
const q = new URLSearchParams(location.search), SCALE = parseFloat(q.get('scale') || '1');
const cv = document.getElementById('c');
cv.width = Math.round(W * SCALE / 2) * 2;
cv.height = Math.round(H * SCALE / 2) * 2;
const ctx = cv.getContext('2d');

async function svgImage(url, w, h) {
  const text = await (await fetch(url)).text();
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const svg = doc.documentElement;
  const vb = (svg.getAttribute('viewBox') || `0 0 ${W} ${H}`).split(/[\s,]+/).map(Number);
  const k = Math.min(w / vb[2], h / vb[3]);
  svg.setAttribute('width', vb[2] * k);
  svg.setAttribute('height', vb[3] * k);
  const img = new Image();
  img.src = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' }));
  await img.decode();
  return img;
}

let imgs = [];
function render(t) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  const img = imgs[Math.min(imgs.length - 1, Math.max(0, Math.floor(t)))];
  ctx.drawImage(img, (cv.width - img.width) / 2, (cv.height - img.height) / 2);
}

window.TOTAL = SRC.length;
window.renderAt = t => render(t);
window.ready = Promise.all(SRC.map(s => svgImage(s, cv.width - 2 * PAD * SCALE, cv.height - 2 * PAD * SCALE))).then(r => {
  imgs = r;
  render(parseFloat(q.get('t') || '0'));
  return true;
});
</script></body></html>
