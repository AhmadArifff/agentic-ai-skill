case_id: "case-20261002-softdelete-credential-regeneration"
title: "Restore Softdelete Akun Entitas dengan Re-generasi Kredensial Acak Otomatis"
status: "verified_case"
category: "pattern"
created_at: "2026-10-02T10:25:00Z"
last_validated: "2026-10-02T10:30:00Z"

domain_tags:
  - "backend"
  - "security"
  - "auth"
  - "rbac"
  - "database"

context_and_problem:
  description: "Pada sistem multi-tenant atau kemitraan agen (OTA/Agent), entitas yang sebelumnya dihapus secara softdelete berisiko mengalami bentrok duplicate entry pada unique constraint saat didaftarkan ulang, atau menggunakan kembali kredensial lama yang berpotensi membocorkan akses."
  symptoms_or_triggers:
    - "Pendaftaran agen baru dengan identifier sama memicu SQLSTATE Integrity constraint violation."
    - "Akun yang dipulihkan masih menggunakan username/password lama yang mungkin telah terkompromi sebelum di-softdelete."

proposed_solution:
  summary: "Sebelum insert baru, periksa keberadaan entitas dengan withTrashed(). Jika ditemukan, lakukan restore() dan langsung acak ulang username serta password menggunakan hash terenkripsi."
  key_mechanisms:
    - "Pemeriksaan idempotensi akun: Ota::withTrashed()->where('code', $code)->first()."
    - "Jika record terhapus: panggil $record->restore()."
    - "Generate otomatis username baru (Str::random(8)) dan password acak ter-bcrypt untuk mencegah credential hijacking."
  trade_offs:
    advantages:
      - "Mencegah duplikasi data dan menjaga integritas relational key audit log historis."
      - "Kredensial lama dinonaktifkan permanen, memenuhi standar kepatuhan OWASP."
    drawbacks:
      - "Pengguna admin harus mendistribusikan ulang kredensial baru ke mitra OTA setelah pemulihan."

dual_approval_audit:
  qa_engineer:
    verdict: "approved"
    approved_at: "2026-10-02T10:28:00Z"
    test_evidence: "Diuji pada skenario pendaftaran ulang agen terhapus; record berhasil di-restore dengan status aktif dan hash password baru. Tidak ada crash constraint violation."
  tech_critic:
    verdict: "approved"
    approved_at: "2026-10-02T10:30:00Z"
    fallacy_check_notes: "Solusi ini mematuhi prinsip Defense-in-Depth dan Inversion. Menolak asumsi bahwa akun lama aman digunakan kembali."

code_reference_or_snippet: |
  $existing = $this->otaRepository->findByCodeWithTrashed($code);
  if ($existing) {
      if ($existing->trashed()) {
          $existing->restore();
      }
      $newPassword = Str::random(12);
      $existing->update([
          'password' => Hash::make($newPassword),
          'status'   => 'ACTIVE'
      ]);
  }
