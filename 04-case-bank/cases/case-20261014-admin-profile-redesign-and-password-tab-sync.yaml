case_id: "CASE-20261014-ADMIN-PROFILE-REDESIGN-TAB-SYNC"
title: "Standarisasi Profil Akun Staf (2 Kartu Bertumpuk: Profile Information & Update Password) & Integrasi Input Group Password"
category: "Frontend UI/UX, Laravel Auth & Form Layout"
date: "2026-10-14"
project: "adminShuttleV3"
spoke: "adminShuttleV3"
author: "Antigravity Multi-Agent Orchestrator"
approvals:
  qa_engineer: "VERIFIED_PASS"
  tech_critic: "VERIFIED_PASS"
tags:
  - "Profile UI Redesign"
  - "Centered Stacked Cards"
  - "validateWithBag"
  - "Integrated Input Group"
  - "Toast Notifications"
  - "Team Visual Consensus"

problem_statement:
  symptoms:
    - "Halaman pengaturan akun sempat menggunakan layout 2-kolom dan tab ganda yang tidak selaras dengan acuan kesepakatan desain tim."
    - "Tombol intip password (eye toggle) terbelah canggung dari input field karena CSS tema global memaksa border-radius 50rem."
    - "Validasi error form ubah password tidak memunculkan notifikasi toast jika hanya memeriksa $errors->any()."
  root_causes:
    - "Ketiadaan dokumentasi pola desain profil di .agents menyebabkan perbedaan konsep tata letak."
    - "Gaya global tema menimpa struktur input-group standar Bootstrap."
    - "Laravel validateWithBag('updatePassword', ...) mengisolasi error ke dalam namespace terpisah."

solution_architecture:
  layers_affected:
    - "Presentation (Blade, CSS, jQuery)": "resources/views/profile/edit.blade.php"
    - "Authentication & Controller": "app/Http/Controllers/Auth/PasswordController.php, app/Http/Controllers/ProfileController.php"
    - "Form Validation": "app/Http/Requests/ProfileUpdateRequest.php"

  key_implementations:
    1_centered_stacked_cards_layout:
      wrapper: "col-xl-9 col-lg-10 col-md-11 mx-auto"
      card_1: "Profile Information dengan judul #1e3a5f, sub-judul Perbarui informasi profil akun Anda, field Nama, Username, No Handphone, Alamat, dan tombol merah #c82333 Simpan Profil."
      card_2: "Update Password dengan judul #1e3a5f, sub-judul Pastikan akun Anda menggunakan kata sandi yang panjang dan acak agar tetap aman., field Password Saat Ini, Password Baru, Konfirmasi Password, dan tombol merah #c82333 Simpan Password."
    2_integrated_rectangular_input_group:
      input_styling: ".profile-card .form-control dengan border-radius: 4px !important dan padding proporsional."
      eye_toggle: "Span input-group-text menyatu di sisi kanan input dengan highlight ring fokus biru #3b82f6."
    3_toast_notifications:
      pattern: "$.toast mengambang di pojok kanan atas (top-right) yang mengevaluasi $errors->updatePassword->first() dan $errors->first() serta session('status')."

prevention_rules:
  - "Kedaulatan acuan desain tim (team visual consensus) adalah prioritas tertinggi. Jika pengguna melampirkan screenshot mockup acuan, sesuaikan 100% mengikuti visual tersebut."
  - "Saat tema memiliki gaya global border-radius 50rem, gunakan selector CSS terisolasi untuk mengembalikan sudut kotak (4px) pada form yang membutuhkan tampilan persegi."
  - "Gunakan validateWithBag() pada form multi-entitas dan selalu periksa bag terkait saat me-render feedback."
