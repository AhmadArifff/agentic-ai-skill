case_id: "case-20260907-resilient-websocket-dual-ecosystem"
title: "Resiliensi Real-Time WebSocket dengan Jittered Exponential Backoff & Offline Queue (Next.js & Vue 3)"
status: "verified_case"
category: "pattern"
