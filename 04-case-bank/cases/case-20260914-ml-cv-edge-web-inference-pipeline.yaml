code_reference_or_snippet: |
  // Client-Side In-Browser Inference via ONNX Runtime Web
  import * as ort from 'onnxruntime-web/webgpu';

  async function runVisionInference(canvasElement) {
    const session = await ort.InferenceSession.create('/models/vision-quantized.onnx', {
      executionProviders: ['webgpu', 'wasm']
    });
    const tensor = preprocessCanvasToTensor(canvasElement); // [1, 3, 224, 224]
    const results = await session.run({ input: tensor });
    return parsePredictions(results.output.data);
  }
