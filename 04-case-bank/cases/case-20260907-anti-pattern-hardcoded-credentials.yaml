case_id: "case-20260907-anti-pattern-hardcoded-credentials"
title: "Larangan Keras Meletakkan Kredensial & Secret Token Langsung di Kode Sumber (Hardcoded Secrets Anti-Pattern)"
status: "verified_case"
category: "anti_pattern"
created_at: "2026-09-07T10:30:00Z"
last_validated: "2026-09-07T11:35:00Z"

domain_tags:
  - "security"
  - "backend"
  - "frontend"
  - "governance"
  - "git"

context_and_problem:
  description: "Pengembang atau agen AI yang terburu-buru sering kali menuliskan kredensial database, API key pihak ketiga (OpenAI, Stripe, GitHub PAT), atau private key langsung di dalam kode sumber atau script testing. Ketika repository di-push ke GitHub publik, kredensial tersebut terindeks dan disalahgunakan oleh bot scraper dalam hitungan detik."
  symptoms_or_triggers:
    - "Potongan kode mengandung `const STRIPE_KEY = 'sk_live_...';` atau `const DB_PASS = 'admin123';`."
    - "File `.env` ikut ter-commit ke git repository karena belum masuk ke `.gitignore`."
    - "Notifikasi kebocoran rahasia dari GitHub Secret Scanning."

proposed_solution:
  summary: "Terapkan aturan imutabel pemisahan konfigurasi dari kode (12-Factor App) menggunakan file .env yang ter-ignore, template .env.example, dan validasi pre-commit linting untuk mendeteksi token dengan entropy tinggi."
  key_mechanisms:
    - "Daftarkan `.env`, `.env.local`, `.env.*.local`, dan file kredensial lainnya ke dalam `.gitignore` sejak inisialisasi awal."
    - "Sediakan `.env.example` yang hanya berisi placeholder nama variabel tanpa nilai rahasia nyata."
    - "Gunakan pustaka validasi skema environment seperti Zod atau Envalid saat startup aplikasi untuk memastikan environment variables terisi dengan tipe data yang benar."
    - "Gunakan Policy Gate & Security Reviewer untuk menggagalkan approval jika regex entropy rahasia ditemukan di diff kode."
  trade_offs:
    advantages:
      - "Mencegah kebocoran akun cloud, tagihan tak terduga, dan kompromi data pengguna."
      - "Mempermudah pergantian konfigurasi antar environment (development, staging, production)."
    drawbacks:
      - "Setiap anggota tim baru atau server deployment harus menyiapkan file .env secara terpisah."

dual_approval_audit:
  qa_engineer:
    verdict: "approved"
    approved_at: "2026-09-07T11:20:00Z"
    test_evidence: "Git repository dipindai menggunakan regex pattern secret; tidak ada secret nyata yang lolos ke riwayat commit."
  tech_critic:
    verdict: "approved"
    approved_at: "2026-09-07T11:25:00Z"
    fallacy_check_notes: "Kepatuhan penuh terhadap standar OWASP A02:2021 (Cryptographic Failures) dan prinsip Zero Trust Architecture."

code_reference_or_snippet: |
  # .gitignore Wajib
  .env
  .env.*
  !.env.example
  *.pem
  *.key

  // Validasi Environment Terpusat (contoh env.ts dengan Zod)
  import { z } from 'zod';
  const envSchema = z.object({
    DATABASE_URL: z.string().url(),
    JWT_SECRET: z.string().min(32),
    PORT: z.coerce.number().default(3000),
  });
  export const env = envSchema.parse(process.env);
