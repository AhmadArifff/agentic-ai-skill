case_id: "case-20261121-stack-diagram-cloud-architecture"
title: "Visualisasi Topologi Infrastruktur Cloud & Monorepo Tooling Berbasis Stack-Diagram dengan Logo Vendor Resmi dan Orthogonal Arrow Routing"
status: "verified_case"
category: "pattern"
created_at: "2026-11-21T11:51:00Z"
last_validated: "2026-11-21T11:55:00Z"

