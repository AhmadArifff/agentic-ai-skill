code_reference_or_snippet: |
  // Semantic Routing Decision Tree
  function routeIntent(prompt) {
    if (/machine learning|deep learning|vision|yolo|clustering|classification/i.test(prompt)) {
      return { builder: 'ml-vision-engineer', reviewer: ['data-cross-verifier', 'qa-engineer'] };
    }
    if (/database|prisma|api|redis|auth/i.test(prompt)) {
      return { builder: 'backend-engineer', reviewer: ['qa-engineer', 'security-engineer'] };
    }
    return { builder: 'frontend-engineer', reviewer: ['qa-engineer', 'user-test-professional'] };
  }
