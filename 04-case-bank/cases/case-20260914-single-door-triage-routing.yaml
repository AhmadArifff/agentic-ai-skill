  - "ux"
  - "natural-language"

context_and_problem:
  description: "Dalam sistem multi-agent dengan puluhan spesialisasi (backend, frontend, qa, ml-vision, security, dll.), menuntut pengguna melakukan tagging manual seperti '@backend' atau '@qa' sangat membebani pengguna (high cognitive friction) dan sering menimbulkan salah sasaran delegasi peran."
  symptoms_or_triggers:
    - "Pengguna bingung agen mana yang harus dipanggil saat masalah melibatkan multi-domain (misal: ML pipeline + frontend WebGPU)."
    - "Instruksi pengguna dialihkan ke agen yang tidak kompeten karena pengguna salah melakukan tagging."
    - "Kurangnya koordinasi pusat menyebabkan beberapa agen bertabrakan mengubah file yang sama."

proposed_solution:
  summary: "Terapkan prinsip Single Door Policy di mana Triage Router bertindak sebagai gerbang utama penerima segala instruksi bahasa alami, menganalisis intensi semantik, dan secara otonom mendekomposisi serta merutekan tugas ke builder dan reviewer terkait di latar belakang."
  key_mechanisms:
    - "Gerbang Tunggal (Single Entry Point): Pengguna cukup berinteraksi dengan bahasa santai/alami tanpa sintaks khusus."
    - "Klasifikasi Semantik: Router mendeteksi kata kunci domain (misal: 'clustering/classification' -> ml-vision-engineer; 'api/auth' -> backend-engineer; 'animasi/komponen' -> frontend-engineer)."
    - "Dekomposisi Otomatis: Tugas lintas-disiplin dipecah menjadi sub-task independen dengan dependensi terarah (DAG)."
    - "Orkestrasi Tak Kasat Mata: Transisi antar-agen terjadi di balik layar, lalu disintesis kembali oleh Synthesis Voice menjadi satu respon akhir yang rapi bagi pengguna."
  trade_offs:
    advantages:
      - "Pengalaman pengguna sangat mulus (zero cognitive overhead)."
      - "Routing tugas selalu akurat berdasarkan kapabilitas agen yang sebenarnya."
    drawbacks:
      - "Membutuhkan fase inferensi awal oleh router sebelum eksekusi dimulai."

dual_approval_audit:
  qa_engineer:
    verdict: "approved"
    approved_at: "2026-09-14T10:50:00Z"
