code_reference_or_snippet: |
  // Akuisisi Lock Atomik
  const acquired = await redis.set(`lock:${itemId}`, lockOwnerId, 'NX', 'PX', 5000);
  if (!acquired) {
    return { success: false, error: 'Resource is currently locked. Try again.' };
  }

  // Pelepasan Lock Aman (Script Lua)
  const luaReleaseScript = `
    if redis.call("get", KEYS[1]) == ARGV[1] then
      return redis.call("del", KEYS[1])
    else
      return 0
    end
  `;
  await redis.eval(luaReleaseScript, 1, `lock:${itemId}`, lockOwnerId);
