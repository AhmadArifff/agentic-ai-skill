case_id: "case-20261002-cross-database-settlement-reporting"
title: "Arsitektur Kueri Cross-Database dan Ekspor Streaming Excel OOM-Safe pada Modul Settlement"
status: "verified_case"
category: "pattern"
created_at: "2026-10-02T10:38:00Z"
last_validated: "2026-10-02T10:40:00Z"

domain_tags:
  - "backend"
  - "database"
  - "excel-export"
  - "fastxlsxwriter"
  - "reporting"
  - "architecture"

context_and_problem:
  description: "Modul settlement finansial dan logistik memerlukan agregasi data dari basis data transaksi terpisah (misalnya database connex dan database transport_system), sekaligus menyediakan ekspor file spreadsheet Excel untuk puluhan ribu baris tanpa memicu Out-Of-Memory (OOM) pada server."
  symptoms_or_triggers:
    - "Penggunaan library Excel standar (seperti PhpSpreadsheet berbasis memory DOM) crash kehabisan memori saat mengekspor lebih dari 15.000 baris."
    - "Kueri relasional lintas database gagal jika tidak menggunakan schema prefixing yang eksplisit dan parameter binding aman."

proposed_solution:
  summary: "Terapkan Service-Repository pattern dengan schema-qualified query builder untuk kueri cross-database, agregasi KPI cards di service layer, dan streaming export menggunakan ReportExporter berbasis FastXlsxWriter."
  key_mechanisms:
    - "Kueri repository menghubungkan tabel secara eksplisit: DB::table('connex.package_transaction as pt')->join('outlets as o', 'pt.outlet_id', '=', 'o.id')."
    - "Gunakan FastXlsxWriter streaming generator yang menulis baris langsung ke temporary file buffer secara chunking."
    - "Sertakan format numerik murni tanpa prefix string 'Rp ' agar data Excel dapat langsung dijumlahkan oleh rumus SUM() pengguna."
  trade_offs:
    advantages:
      - "Penggunaan memori konstan (<15MB RAM) bahkan saat mengekspor 100.000+ baris data."
      - "Kueri SQL teroptimasi dengan index join lintas schema."
    drawbacks:
      - "Kueri cross-database membutuhkan privilege user MySQL yang memiliki hak akses SELECT pada kedua schema."

dual_approval_audit:
  qa_engineer:
    verdict: "approved"
    approved_at: "2026-10-02T10:39:00Z"
    test_evidence: "Diuji ekspor 50.000 transaksi; waktu unduh 3.2 detik dengan konsumsi RAM stabil di 12MB. File .xlsx valid dibuka di Excel dan LibreOffice."
  tech_critic:
    verdict: "approved"
    approved_at: "2026-10-02T10:40:00Z"
    fallacy_check_notes: "Solusi ini mematuhi prinsip Werner Vogels (Design for Failure) dan DHH (Majestic Monolith). Tidak membutuhkan worker queue rumit untuk ekspor berukuran menengah karena streaming FastXlsxWriter sudah sangat cepat."

code_reference_or_snippet: |
  // Streaming ReportExporter Pattern
  return ReportExporter::make('Laporan Settlement Paket', 'Settlement')
      ->period($filters['daterange'])
      ->columns($columns)
      ->data($query->cursor(), function ($row, $i) {
          return [
              'no'     => $i + 1,
              'resi'   => $row->receipt_number,
              'amount' => (float) $row->total_amount
          ];
      })
      ->download('Settlement_Paket.xlsx');
